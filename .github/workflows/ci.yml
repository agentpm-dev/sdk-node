name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      cli_ref:
        description: Compatible CLI ref (>=0.1.43); use the proposed ref before CLI main is updated
        default: main
        type: string
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build-test-lint:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, macos-15-intel, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: sdk
        shell: bash
    steps:
      - name: Checkout SDK
        uses: actions/checkout@v4
        with:
          path: sdk
      - name: Checkout compatible CLI contract and runner
        uses: actions/checkout@v4
        with:
          repository: agentpm-dev/cli
          ref: ${{ inputs.cli_ref || vars.AGENTPM_CLI_REF || 'main' }}
          path: cli
      - uses: dtolnay/rust-toolchain@stable
      - name: Build the authoritative CLI
        working-directory: cli
        run: cargo build -p agentpm-cli
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.13.5'
          python-version: ${{ matrix.python || '3.11' }}
          enable-cache: false
      - name: Select test executables and check shared fixtures
        shell: bash
        working-directory: sdk
        env:
          SDK_TEST_PYTHON_VERSION: ${{ matrix.python || '3.11' }}
        run: |
          uv run --no-project --python "$SDK_TEST_PYTHON_VERSION" python - <<'PYCODE'
          import os, pathlib, platform, shutil, subprocess, sys
          expected = os.environ['SDK_TEST_PYTHON_VERSION']
          actual = f'{sys.version_info.major}.{sys.version_info.minor}'
          if actual != expected:
              raise SystemExit(f'Expected Python {expected} for SDK fixtures, got {actual}')
          python = pathlib.Path(sys.executable).resolve()
          child_version = subprocess.check_output([str(python), '-I', '-c', "import sys; print(f'{sys.version_info.major}.{sys.version_info.minor}')"], text=True).strip()
          if child_version != expected:
              raise SystemExit(f'Fixture interpreter {python} reports {child_version}, expected {expected}')
          print('Native SDK host:', platform.system(), platform.machine(), sys.version.split()[0], python)
          cli = pathlib.Path('../cli').resolve()
          binary = cli / 'target/debug' / ('agentpm.exe' if os.name == 'nt' else 'agentpm')
          with open(os.environ['GITHUB_ENV'], 'a') as out:
              for name, value in {'AGENTPM': binary, 'AGENTPM_TEST_CLI': binary, 'AGENTPM_TEST_UV': shutil.which('uv'), 'AGENTPM_TEST_PYTHON': python, 'AGENTPM_PYTHON': python, 'AGENTPM_TELEMETRY': '0'}.items():
                  print(f'{name}={value}', file=out)
          subprocess.run([sys.executable, str(cli/'scripts/check_sdk_contract.py'), '--cli-root', str(cli), '--sdk-root', str(pathlib.Path.cwd())], check=True)
          PYCODE
      - uses: pnpm/action-setup@v4
        with:
          version: 10.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: sdk/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm format
      - run: pnpm lint
      - run: pnpm typecheck
      - name: Test, including native-dependency SDK invocation
        run: pnpm test
      - run: pnpm build
      - name: Smoke ESM and CJS exports
        run: |
          node --input-type=module -e "import {load, loadAgent} from './dist/index.js'; if(typeof load !== 'function') process.exit(1)"
          node -e "const {load,loadAgent}=require('./dist/index.cjs'); if(typeof load !== 'function') process.exit(1)"
      - run: pnpm pack
      - uses: actions/upload-artifact@v4
        with:
          name: npm-pack-${{ matrix.os }}
          path: sdk/*.tgz
